name: Graphify Provenance

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run provenance tests
        run: >
          python -m pytest -q
          tests/test_stage_39_1_engineering_proof.py
          tests/test_stage_39_2_github_proof_binding.py
          tests/test_external_integration_provenance.py
          tests/test_github_evidence_adapter.py
